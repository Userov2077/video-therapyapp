<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Therapy Call | Сообщество психологов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --green: #8bca8b;
            --green-dark: #5a9e5a;
            --green-dim: rgba(139,202,139,0.15);
            --green-border: rgba(139,202,139,0.25);
            --glass: rgba(20,26,22,0.65);
            --glass-hover: rgba(28,36,30,0.82);
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(139,202,139,0.28);
            --text-muted: rgba(255,255,255,0.45);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --nav-h: 62px;
            --bottom-h: 68px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:'Inter',sans-serif;
            background:#050a06;
            color:#fff;
            overflow-x:hidden;
            padding-bottom:calc(var(--bottom-h) + 12px);
            min-height:100vh;
        }
        /* Фиксация страницы при открытом чате (iOS Safari fix) */
        body.chat-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        body.chat-open .main-content {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            height: calc(100vh - var(--nav-h) - var(--bottom-h) - env(safe-area-inset-bottom, 0px));
        }
        .video-background { position:fixed; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; }
        .video-overlay { position:fixed; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(0,0,0,0.72) 0%,rgba(2,8,4,0.55) 60%,rgba(0,0,0,0.8) 100%); }
        .navbar {
            position:fixed; top:0; left:0; right:0; height:var(--nav-h);
            background:rgba(4,10,5,0.78); backdrop-filter:blur(28px); z-index:1000;
            padding:0 20px; border-bottom:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center;
        }
        .logo { display:flex; align-items:center; gap:9px; font-weight:700; }
        .auth-buttons { display:flex; gap:8px; }
        .btn-login, .btn-register, .btn-logout { padding:7px 18px; border-radius:30px; font-weight:500; font-size:13px; cursor:pointer; transition:0.22s; }
        .btn-login { background:transparent; border:1px solid var(--green-border); color:#fff; }
        .btn-login:hover { background:var(--green-dim); }
        .btn-register { background:linear-gradient(135deg,var(--green),var(--green-dark)); border:none; color:#0d2010; }
        .btn-register:hover { opacity:0.88; transform:scale(1.02); }
        .btn-logout { background:rgba(220,38,38,0.18); border:1px solid rgba(220,38,38,0.35); color:#ff6b6b; }
        .btn-logout:hover { background:rgba(220,38,38,0.32); }
        .search-btn {
            background:rgba(255,255,255,0.08); backdrop-filter:blur(10px);
            border:1px solid var(--border); width:36px; height:36px;
            border-radius:50%; color:rgba(255,255,255,0.75); cursor:pointer;
        }
        .search-btn:hover { background:var(--green-dim); color:var(--green); }
        #navUser { display:flex; gap:8px; align-items:center; }
        .main-content { padding-top:calc(var(--nav-h) + 12px); min-height:100vh; }
        .container { max-width:680px; margin:0 auto; padding:0 16px; }
        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0; height:var(--bottom-h);
            background:rgba(4,10,5,0.9); backdrop-filter:blur(28px);
            display:flex; justify-content:space-around; align-items:center;
            padding:8px 8px calc(8px + env(safe-area-inset-bottom));
            border-top:1px solid var(--border); z-index:1000;
        }
        .nav-item {
            display:flex; flex-direction:column; align-items:center; gap:3px;
            color:var(--text-muted); cursor:pointer; padding:6px 14px; border-radius:16px;
        }
        .nav-item i { font-size:21px; transition:0.2s; }
        .nav-item span { font-size:9.5px; font-weight:500; }
        .nav-item.active { color:var(--green); background:var(--green-dim); }
        .nav-item.active i { transform:scale(1.1); }
        .glass-card { background:var(--glass); backdrop-filter:blur(22px); border:1px solid var(--border); border-radius:var(--radius-lg); transition:0.28s; }
        .glass-card:hover { background:var(--glass-hover); border-color:var(--border-hover); }
        .btn-sm {
            padding:8px 18px; font-size:13px; border-radius:30px;
            background:linear-gradient(135deg,var(--green),var(--green-dark));
            border:none; color:#0d2010; cursor:pointer; font-weight:600; white-space:nowrap;
        }
        .btn-sm:hover { opacity:0.88; transform:scale(1.02); }
        .btn-outline { background:transparent!important; border:1px solid var(--green-border)!important; color:rgba(255,255,255,0.85)!important; }
        .btn-outline:hover { background:var(--green-dim)!important; color:var(--green)!important; }
        .btn-danger { background:rgba(220,38,38,0.2)!important; border:1px solid rgba(220,38,38,0.35)!important; color:#ff6b6b!important; }
        .btn-danger:hover { background:rgba(220,38,38,0.35)!important; }
        .posts-grid { display:flex; flex-direction:column; gap:14px; }
        .post-card { padding:18px; }
        .post-header { display:flex; gap:12px; margin-bottom:14px; }
        .post-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--green-border); cursor:pointer; }
        .post-author { font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
        .post-time { font-size:11px; color:var(--text-muted); margin-top:2px; }
        .post-text { margin-bottom:12px; line-height:1.6; font-size:14px; }
        .post-image { max-width:100%; border-radius:var(--radius-md); margin-bottom:12px; cursor:pointer; }
        .post-stats { display:flex; gap:18px; padding:10px 0; border-top:1px solid var(--border); }
        .post-stats button { background:none; border:none; color:var(--text-muted); display:flex; gap:6px; align-items:center; font-size:13px; padding:2px 6px; border-radius:8px; cursor:pointer; }
        .post-stats button.liked { color:var(--green); }
        .post-actions { display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
        .post-actions button { background:none; border:none; color:var(--text-muted); font-size:12px; padding:4px 10px; border-radius:8px; cursor:pointer; }
        .rating-stars { color:#f5c518; font-size:11px; display:inline-flex; gap:1px; }
        .comments-section { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
        .comment { display:flex; gap:10px; margin-bottom:10px; }
        .comment-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; }
        .comment-content { background:rgba(255,255,255,0.05); border-radius:var(--radius-sm); padding:8px 12px; flex:1; }
        .comment-author { font-weight:600; font-size:12px; color:var(--green); }
        .comment-text { font-size:13px; }
        .comment-time { font-size:10px; color:var(--text-muted); margin-top:4px; }
        .new-comment { display:flex; gap:8px; margin-top:10px; }
        .new-comment input { flex:1; padding:9px 14px; border-radius:30px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:#fff; }
        .profile-header { text-align:center; padding:20px 0 16px; }
        .profile-avatar-wrap { position:relative; display:inline-block; }
        .profile-avatar-lg { width:92px; height:92px; border-radius:50%; object-fit:cover; border:3px solid var(--green); cursor:pointer; box-shadow:0 0 0 6px rgba(139,202,139,0.12); }
        .avatar-edit-btn { position:absolute; bottom:2px; right:2px; width:26px; height:26px; border-radius:50%; background:var(--green); border:2px solid #050a06; color:#0d2010; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .profile-name { font-size:22px; font-weight:700; margin-top:12px; }
        .profile-role-badge { display:inline-block; margin-top:5px; padding:3px 12px; background:var(--green-dim); border:1px solid var(--green-border); border-radius:20px; font-size:11px; color:var(--green); }
        .profile-bio { color:var(--text-muted); margin-top:8px; font-size:13.5px; max-width:400px; margin-left:auto; margin-right:auto; }
        .profile-stats { display:flex; justify-content:center; margin:18px 0 14px; background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
        .profile-stat { flex:1; text-align:center; padding:14px 8px; border-right:1px solid var(--border); }
        .profile-stat:last-child { border-right:none; }
        .profile-stat .number { font-size:20px; font-weight:700; }
        .profile-stat .label { font-size:10.5px; color:var(--text-muted); }
        .profile-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0 6px; }
        .profile-sections { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
        .collapsible-section { background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
        .collapsible-section.open { border-color:var(--green-border); }
        .collapsible-header { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; cursor:pointer; }
        .collapsible-header-left { display:flex; gap:10px; align-items:center; }
        .collapsible-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--green-dim); }
        .collapsible-title { font-weight:600; }
        .collapsible-subtitle { font-size:11.5px; color:var(--text-muted); }
        .collapsible-chevron { transition:0.28s; }
        .collapsible-section.open .collapsible-chevron { transform:rotate(180deg); color:var(--green); }
        .collapsible-body { max-height:0; overflow:hidden; transition:max-height 0.38s, padding 0.28s; padding:0 18px; }
        .collapsible-section.open .collapsible-body { max-height:2000px; padding:0 18px 18px; }
        .task-item { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; background:rgba(255,255,255,0.04); border-radius:var(--radius-md); margin-bottom:8px; border:1px solid var(--border); }
        .task-checkbox { width:18px; height:18px; accent-color:var(--green); cursor:pointer; margin-top:2px; }
        .task-text { flex:1; font-size:13.5px; }
        .task-due { font-size:11px; color:var(--text-muted); margin-top:3px; }
        .task-completed { opacity:0.45; text-decoration:line-through; }
        .task-delete { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; }
        .section-add-btn { width:100%; padding:10px; background:var(--green-dim); border:1px dashed var(--green-border); color:var(--green); border-radius:var(--radius-sm); cursor:pointer; margin-top:4px; }
        .apple-calendar { background:rgba(20,26,22,0.5); border-radius:20px; padding:12px; backdrop-filter:blur(12px); }
        .apple-calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:0 4px; }
        .apple-calendar-header h3 { font-size:17px; font-weight:600; color:var(--green); }
        .apple-calendar-nav-btn { background:rgba(255,255,255,0.1); border:none; width:32px; height:32px; border-radius:30px; color:#fff; cursor:pointer; }
        .apple-calendar-nav-btn:hover { background:var(--green-dim); color:var(--green); }
        .apple-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; font-weight:500; color:rgba(255,255,255,0.5); margin-bottom:12px; }
        .apple-days { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
        .apple-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; border-radius:30px; cursor:pointer; background:rgba(255,255,255,0.02); position:relative; }
        .apple-day:hover { background:rgba(139,202,139,0.2); transform:scale(1.02); }
        .apple-day.today { background:var(--green); color:#0d2010; font-weight:700; box-shadow:0 2px 8px rgba(139,202,139,0.3); }
        .apple-day.has-event { background:var(--green-dim); border:1px solid var(--green-border); font-weight:600; color:#8bca8b; }
        .apple-day.other-month { opacity:0.3; }
        .event-dot-apple { width:5px; height:5px; background:var(--green); border-radius:50%; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); }
        .appointment-item, .client-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:rgba(255,255,255,0.04); border-radius:var(--radius-md); margin-bottom:8px; border:1px solid var(--border); flex-wrap:wrap; }
        .appt-info { flex:1; }
        .appt-name { font-weight:600; }
        .appt-time { font-size:12px; color:var(--text-muted); }
        .appt-status { font-size:11px; margin-top:3px; }
        .status-pending { color:#f59e0b; }
        .status-confirmed { color:var(--green); }
        .notes-grid { display:flex; flex-direction:column; gap:8px; }
        .note-card { padding:12px 14px; background:rgba(255,255,255,0.04); border-radius:var(--radius-md); cursor:pointer; border:1px solid var(--border); }
        .certificates-grid { display:flex; gap:10px; flex-wrap:wrap; }
        .certificate-card { background:rgba(255,255,255,0.05); border-radius:var(--radius-md); padding:10px; text-align:center; width:96px; position:relative; border:1px solid var(--border); }
        .certificate-card img { width:100%; height:72px; object-fit:cover; border-radius:var(--radius-sm); }
        .certificate-title { font-size:10.5px; font-weight:500; }
        .delete-cert-btn { position:absolute; top:-7px; right:-7px; background:rgba(220,38,38,0.9); border:none; color:#fff; width:22px; height:22px; border-radius:50%; cursor:pointer; }
        .add-cert-card { cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; height:108px; background:var(--green-dim)!important; border:1px dashed var(--green-border)!important; }
        .psychologists-list { display:flex; flex-direction:column; gap:10px; }
        .psychologist-item { display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer; border-radius:var(--radius-lg); }
        .psychologist-item:hover { background:var(--glass-hover); transform:translateX(3px); }
        .psychologist-avatar-list { width:54px; height:54px; border-radius:50%; object-fit:cover; border:2px solid var(--green-border); }
        .chat-list { display:flex; flex-direction:column; gap:8px; }
        .chat-contact { display:flex; align-items:center; gap:14px; padding:13px 16px; cursor:pointer; border-radius:var(--radius-lg); position:relative; }
        .chat-contact:hover { background:var(--glass-hover); }
        .chat-contact-avatar { width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid var(--green-border); }
        .chat-contact-info { flex:1; }
        .chat-contact-name { font-weight:600; }
        .chat-contact-last { font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .unread-badge {
            background:var(--green); color:#0d2010; border-radius:20px;
            padding:3px 10px; font-size:11px; font-weight:700;
        }
        .unread-dot {
            position:absolute;
            top:12px;
            right:12px;
            width:10px;
            height:10px;
            background:#ff3b30;
            border-radius:50%;
            border:2px solid var(--glass);
        }
        .chat-page { height:calc(100vh - var(--nav-h) - var(--bottom-h) - env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; padding:0 8px; }
        .chat-messages-container { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--glass); backdrop-filter:blur(22px); border:1px solid var(--border); border-radius:var(--radius-lg); }
        .chat-messages-header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
        .chat-messages-list { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling: touch; }
        .message { max-width:72%; padding:10px 14px; border-radius:20px; word-wrap:break-word; }
        .message.outgoing { align-self:flex-end; background:linear-gradient(135deg,var(--green),var(--green-dark)); color:#0d2010; border-bottom-right-radius:5px; }
        .message.incoming { align-self:flex-start; background:rgba(255,255,255,0.1); border-bottom-left-radius:5px; }
        .message-text { font-size:14px; }
        .message-time { font-size:10px; opacity:0.55; margin-top:4px; text-align:right; }
        .chat-image { max-width:180px; max-height:140px; border-radius:var(--radius-sm); margin-top:4px; cursor:pointer; object-fit:cover; }
        .voice-message { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:rgba(0,0,0,0.3); border-radius:30px; padding:4px 12px; margin-top:4px; }
        .voice-message audio { height:36px; border-radius:30px; }
        .speed-btn { background:rgba(139,202,139,0.2); border:none; color:var(--green); font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; cursor:pointer; }
        .speed-btn:hover { background:var(--green); color:#0d2010; }
        .chat-input-area { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:rgba(0,0,0,0.25); }
        .chat-input-area input { flex:1; padding:10px 16px; border-radius:30px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff; }
        .chat-controls { display:flex; gap:6px; }
        .chat-controls button, .send-btn-chat { width:40px; height:40px; border-radius:50%; cursor:pointer; }
        .chat-controls button { background:rgba(255,255,255,0.08); border:1px solid var(--border); color:rgba(255,255,255,0.7); }
        .send-btn-chat { background:linear-gradient(135deg,var(--green),var(--green-dark)); border:none; color:#0d2010; }
        .recording-active { background:rgba(220,38,38,0.8)!important; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.55;} }
        .notifications-list { display:flex; flex-direction:column; gap:10px; }
        .notification-item { padding:16px 18px; }
        .modal {
            position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(28px);
            display:flex; align-items:flex-end; justify-content:center; z-index:2000;
            opacity:0; visibility:hidden; transition:0.28s;
        }
        .modal.active { opacity:1; visibility:visible; }
        .modal-content {
            width:100%; max-width:560px; padding:26px 24px 32px;
            background:rgba(14,22,15,0.97); backdrop-filter:blur(40px);
            border-radius:28px 28px 0 0; border:1px solid var(--border); border-bottom:none;
            max-height:88vh; overflow-y:auto; transform:translateY(40px); transition:0.32s;
        }
        .modal.active .modal-content { transform:translateY(0); }
        .modal-handle { width:36px; height:4px; background:rgba(255,255,255,0.18); border-radius:2px; margin:0 auto 20px; }
        .modal-content h3 { font-size:20px; font-weight:700; margin-bottom:20px; }
        .modal-content input, .modal-content textarea, .modal-content select {
            width:100%; padding:12px 14px; border-radius:var(--radius-md);
            border:1px solid var(--border); background:rgba(255,255,255,0.06);
            color:#fff; margin-bottom:12px;
        }
        .modal-buttons { display:flex; gap:10px; margin-top:18px; }
        .modal-buttons button { flex:1; padding:13px; border-radius:40px; font-weight:600; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,var(--green),var(--green-dark)); border:none; color:#0d2010; }
        .btn-secondary { background:transparent; border:1px solid var(--border); color:rgba(255,255,255,0.75); }
        .toast {
            position:fixed; bottom:calc(var(--bottom-h) + 18px); left:50%; transform:translateX(-50%);
            background:rgba(14,22,15,0.96); backdrop-filter:blur(20px);
            border:1px solid var(--green-border); border-radius:40px;
            padding:10px 20px; color:var(--green); font-size:13px; font-weight:500;
            z-index:3000; animation:toastIn 0.3s ease; white-space:nowrap;
        }
        .toast.error { border-color:rgba(220,38,38,0.4); color:#ff6b6b; }
        @keyframes toastIn { from{opacity:0; transform:translateX(-50%) translateY(16px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
        .floating-notif {
            position:fixed; top:calc(var(--nav-h) + 8px); right:16px; max-width:280px;
            background:rgba(14,22,15,0.96); backdrop-filter:blur(20px);
            border-left:4px solid var(--green); border-radius:14px;
            padding:12px 16px; box-shadow:0 8px 20px rgba(0,0,0,0.3);
            z-index:4000; transform:translateX(120%); transition:transform 0.3s ease;
            font-size:13px;
        }
        .floating-notif.show { transform:translateX(0); }
        .floating-notif .fn-title { font-weight:700; color:var(--green); margin-bottom:4px; }
        .floating-notif.error { border-left-color:#ff6b6b; }
        .floating-notif.warning { border-left-color:#f5c518; }
        .back-btn { background:rgba(255,255,255,0.08); border:1px solid var(--border); width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
        .time-slot { background:var(--green-dim); border:1px solid var(--green-border); padding:6px 14px; border-radius:20px; margin:4px; cursor:pointer; font-size:13px; }
        .time-slot.selected { background:var(--green); color:#0d2010; font-weight:600; }
        .schedule-modal-list { max-height:240px; overflow-y:auto; margin-bottom:16px; }
        .schedule-modal-form { background:rgba(255,255,255,0.04); border-radius:var(--radius-md); padding:12px; margin-bottom:16px; }
        .section-header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

<body>
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://sylvan.apple.com/itunes-assets/Aerials116/v4/cb/5b/50/cb5b5035-6701-619f-9065-3d7d0e5fbef4/A007C0001_Final_v2_HEVC.mov" type="video/mp4">
    </video>

    <nav class="navbar">

    <main class="main-content" id="mainContent"></main>

    <div id="bottomNav" class="bottom-nav" style="display:none;">
        <div class="nav-item" data-tab="feed"><i class="fas fa-home"></i><span>Лента</span></div>
        <div class="nav-item" data-tab="psychologists"><i class="fas fa-users"></i><span>Психологи</span></div>
        <div class="nav-item" data-tab="chats"><i class="fas fa-comment-dots"></i><span>Чаты</span></div>
        <div class="nav-item" data-tab="notifications"><i class="fas fa-bell"></i><span>Уведомления</span></div>
        <div class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Профиль</span></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    // ======================= ГЛОБАЛЬНЫЕ =======================
    let currentUser = null;
    let currentTab = 'feed';
    let socket = null;
    let allPsychologists = [];
    let currentChatPartner = null;
    let currentCalendarDate = new Date();
    let isLoading = false;
    let unreadCounts = {}; // { contactId: count }

    // ======================= УВЕДОМЛЕНИЯ (ЗВУК ЧЕРЕЗ WEB AUDIO) =======================
    function notifySound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.2;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.4);
            setTimeout(() => audioCtx.close(), 500);
        } catch(e) { console.warn('Audio not supported'); }
    }

    function showFloatingNotification(title, message, type = 'info') {
        const existing = document.querySelector('.floating-notif');
        if (existing) existing.remove();
        const notif = document.createElement('div');
        notif.className = `floating-notif ${type}`;
        notif.innerHTML = `<div class="fn-title">${escapeHtml(title)}</div><div class="fn-message">${escapeHtml(message)}</div>`;
        document.body.appendChild(notif);
        setTimeout(() => notif.classList.add('show'), 10);
        setTimeout(() => {
            notif.classList.remove('show');
            setTimeout(() => notif.remove(), 300);
        }, 5000);
        notifySound();
    }

    // ======================= ВСПОМОГАТЕЛЬНЫЕ =======================
    function showToast(msg, isErr = false) {
        document.querySelectorAll('.toast').forEach(t => t.remove());
        const t = document.createElement('div');
        t.className = `toast${isErr ? ' error' : ''}`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3200);
    }

    async function fetchJSON(url, opt = {}) {
        try {
            const r = await fetch(url, opt);
            return await r.json();
        } catch(e) { showToast('Ошибка соединения', true); return { success: false }; }
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
    }

    function renderStars(r) {
        let s = '';
        const full = Math.floor(r);
        for (let i=0;i<full;i++) s+='<i class="fas fa-star"></i>';
        for (let i=full;i<5;i++) s+='<i class="far fa-star"></i>';
        return `<span class="rating-stars">${s}</span>`;
    }

    function toggleSection(el) {
        const section = el.closest('.collapsible-section');
        section.classList.toggle('open');
    }

    async function compressImage(file, maxSize = 1024, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width, height = img.height;
                if (width > maxSize || height > maxSize) {
                    if (width > height) {
                        height = Math.round(height * (maxSize / width));
                        width = maxSize;
                    } else {
                        width = Math.round(width * (maxSize / height));
                        height = maxSize;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
        });
    }

    function scrollToBottom() {
        const container = document.getElementById('chatMessagesList');
        if (container) container.scrollTop = container.scrollHeight;
    }

    function openImageModal(imgUrl) {
        const html = `<div class="modal" id="imageModal"><div class="modal-content" style="max-width:90vw;background:rgba(0,0,0,0.9);padding:10px;"><div class="modal-handle"></div><img src="${escapeHtml(imgUrl)}" style="width:100%;border-radius:12px;"><div class="modal-buttons"><button class="btn-secondary" onclick="closeModal('imageModal')">Закрыть</button></div></div></div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('imageModal').classList.add('active'), 10);
    }

    // ======================= ЛЕНТА =======================
    async function renderFeed() {
        document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
        const data = await fetchJSON(`/api/posts?userId=${currentUser?.id || ''}`);
        if (!data.success) return;
        const posts = data.posts;
        let html = `<div class="container"><div class="posts-grid">`;
        for (const post of posts) {
            html += `
                <div class="post-card glass-card" data-post-id="${post.id}">
                    <div class="post-header">
                        <img class="post-avatar" src="${escapeHtml(post.author.avatar)}" onclick="viewPsychologistPage('${post.author.id}')">
                        <div>
                            <div class="post-author" onclick="viewPsychologistPage('${post.author.id}')">
                                ${escapeHtml(post.author.fullName)}
                                ${renderStars(post.author.rating || 0)}
                            </div>
                            <div class="post-time">${new Date(post.createdAt).toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="post-text">${escapeHtml(post.text)}</div>
                    ${post.image ? `<img class="post-image" src="${escapeHtml(post.image)}" onclick="openImageModal('${escapeHtml(post.image)}')">` : ''}
                    <div class="post-stats">
                        <button class="like-btn${post.userLiked ? ' liked' : ''}" data-id="${post.id}">
                            <i class="fa-${post.userLiked ? 'solid' : 'regular'} fa-heart"></i>
                            <span>${post.likesCount || 0}</span>
                        </button>
                        <button class="comment-toggle" data-id="${post.id}">
                            <i class="fa-regular fa-comment"></i>
                            <span>${post.commentsCount || 0}</span>
                        </button>
                    </div>
                    <div class="comments-section" id="comments-${post.id}" style="display:none">
                        <div class="comments-list">
                            ${(post.comments || []).map(c => `
                                <div class="comment">
                                    <img class="comment-avatar" src="${escapeHtml(c.author.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=8bca8b&color=fff'">
                                    <div class="comment-content">
                                        <div class="comment-author">${escapeHtml(c.author.fullName)}</div>
                                        <div class="comment-text">${escapeHtml(c.text)}</div>
                                        <div class="comment-time">${new Date(c.createdAt).toLocaleString()}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        ${currentUser ? `
                        <div class="new-comment">
                            <input type="text" placeholder="Написать комментарий..." id="comment-input-${post.id}" onkeypress="if(event.key==='Enter')addComment('${post.id}')">
                            <button class="btn-sm" onclick="addComment('${post.id}')"><i class="fas fa-paper-plane"></i></button>
                        </div>` : ''}
                    </div>
                    ${currentUser && post.author.id === currentUser.id ? `
                    <div class="post-actions">
                        <button class="edit-post-btn" data-id="${post.id}"><i class="fas fa-pen"></i> Редактировать</button>
                        <button class="delete-post-btn" data-id="${post.id}"><i class="fas fa-trash-alt"></i> Удалить</button>
                    </div>` : ''}
                </div>
            `;
        }
        if (posts.length === 0) html += '<div class="empty-state glass-card"><i class="fas fa-newspaper"></i><div>Пока нет постов</div></div>';
        html += `</div></div>`;
        document.getElementById('mainContent').innerHTML = html;
        attachFeedEvents();
    }

    function attachFeedEvents() {
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.onclick = async () => {
                if (isLoading || !currentUser) { showToast('Войдите в аккаунт', true); return; }
                isLoading = true;
                const postId = btn.dataset.id;
                const res = await fetch(`/api/posts/${postId}/like`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId: currentUser.id }) });
                const data = await res.json();
                if (data.success) {
                    btn.querySelector('span').textContent = data.likesCount;
                    btn.classList.toggle('liked', data.liked);
                    btn.querySelector('i').className = data.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                }
                isLoading = false;
            };
        });
        document.querySelectorAll('.comment-toggle').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                const div = document.getElementById(`comments-${id}`);
                const isHidden = div.style.display === 'none';
                div.style.display = isHidden ? 'block' : 'none';
                btn.querySelector('i').className = isHidden ? 'fa-solid fa-comment' : 'fa-regular fa-comment';
            };
        });
        document.querySelectorAll('.edit-post-btn').forEach(btn => {
            btn.onclick = () => {
                const postCard = btn.closest('.post-card');
                const currentText = postCard.querySelector('.post-text').innerText;
                openEditPostModal(btn.dataset.id, currentText);
            };
        });
        document.querySelectorAll('.delete-post-btn').forEach(btn => {
            btn.onclick = () => openConfirmModal('Удалить пост?', 'Это действие нельзя отменить.', async () => {
                await fetch(`/api/posts/${btn.dataset.id}`, { method: 'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ authorId: currentUser.id }) });
                renderFeed();
            });
        });
    }

    function openEditPostModal(postId, currentText) {
        const html = `
            <div class="modal" id="editPostModal">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>✏️ Редактировать пост</h3>
                    <textarea id="editPostText" rows="5">${escapeHtml(currentText)}</textarea>
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="closeModal('editPostModal')">Отмена</button>
                        <button class="btn-primary" onclick="saveEditPost('${postId}')">Сохранить</button>
                    </div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('editPostModal').classList.add('active'), 10);
    }

    async function saveEditPost(postId) {
        const newText = document.getElementById('editPostText').value;
        if (!newText.trim()) { showToast('Текст не может быть пустым', true); return; }
        const fd = new FormData();
        fd.append('authorId', currentUser.id);
        fd.append('text', newText);
        await fetch(`/api/posts/${postId}`, { method: 'PUT', body: fd });
        closeModal('editPostModal');
        renderFeed();
    }

    async function addComment(postId) {
        if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
        const input = document.getElementById(`comment-input-${postId}`);
        if (!input || !input.value.trim()) return;
        await fetch(`/api/posts/${postId}/comment`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId: currentUser.id, text: input.value.trim() }) });
        input.value = '';
        renderFeed();
    }

    // ======================= ПСИХОЛОГИ =======================
    async function renderPsychologistsList() {
        document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
        const data = await fetchJSON('/api/psychologists');
        allPsychologists = data.psychologists || [];
        let html = `<div class="container"><div class="page-title">Психологи</div><div class="psychologists-list">`;
        for (const p of allPsychologists) {
            html += `
                <div class="psychologist-item glass-card" onclick="viewPsychologistPage('${p.id}')">
                    <img class="psychologist-avatar-list" src="${escapeHtml(p.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.fullName)}&background=8bca8b&color=fff'">
                    <div class="psychologist-info">
                        <div class="psychologist-name">${escapeHtml(p.fullName)}</div>
                        <div class="psychologist-spec">${escapeHtml(p.specialization || 'Психолог')}</div>
                        <div style="display:flex;align-items:center;gap:8px;margin-top:5px;">
                            ${renderStars(p.rating || 0)}
                            <span class="psychologist-price">💰 ${p.price || 0} ₸/час</span>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right psychologist-chevron"></i>
                </div>
            `;
        }
        if (allPsychologists.length === 0) html += '<div class="empty-state glass-card"><i class="fas fa-users"></i><div>Пока нет психологов</div></div>';
        html += `</div></div>`;
        document.getElementById('mainContent').innerHTML = html;
    }

    // ======================= ПРОФИЛЬ =======================
    async function renderProfile() {
        if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
        const isPsych = currentUser.role === 'psychologist';
        document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;

        const [postsRes, tasksRes, notesRes, subsRes] = await Promise.all([
            fetchJSON(`/api/posts?userId=${currentUser.id}`),
            isPsych ? fetchJSON(`/api/tasks/${currentUser.id}`) : Promise.resolve({ tasks: [] }),
            isPsych ? fetchJSON(`/api/notes/${currentUser.id}`) : Promise.resolve({ notes: [] }),
            fetchJSON(`/api/subscriptions/${currentUser.id}`)
        ]);

        const myPosts = (postsRes.posts || []).filter(p => p.author.id === currentUser.id);
        const tasks = tasksRes.tasks || [];
        const notes = notesRes.notes || [];
        const appointments = currentUser.clients || [];
        const certificates = currentUser.certificates || [];
        const followersCount = subsRes.followers?.length || 0;

        let psychSections = '';
        if (isPsych) {
            const pendingCount = appointments.filter(a => a.status === 'pending').length;
            const confirmedCount = appointments.filter(a => a.status === 'confirmed').length;
            const undoneTasks = tasks.filter(t => !t.completed).length;

            psychSections = `
            <div class="profile-sections">

                    <div class="collapsible-header" onclick="toggleSection(this)">
                        <div class="collapsible-header-left">
                            <div class="collapsible-icon">📋</div>
                            <div>
                                <div class="collapsible-title">Задачи</div>
                                <div class="collapsible-subtitle">${undoneTasks > 0 ? `${undoneTasks} не выполнено` : 'Все выполнены'}</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-down collapsible-chevron"></i>
                    </div>
                    <div class="collapsible-body">
                        ${tasks.map(t => `
                            <div class="task-item">
                                <input type="checkbox" class="task-checkbox task-cb" data-id="${t.id}" ${t.completed ? 'checked' : ''}>
                                <div style="flex:1">
                                    <div class="task-text ${t.completed ? 'task-completed' : ''}">${escapeHtml(t.text)}</div>
                                    ${t.dueDate ? `<div class="task-due">📅 ${t.dueDate}</div>` : ''}
                                </div>
                                <button class="task-delete" onclick="deleteTask('${t.id}')"><i class="fas fa-times"></i></button>
                            </div>
                        `).join('')}
                        ${tasks.length === 0 ? '<div class="empty-state" style="padding:16px;"><i class="fas fa-check-circle"></i><div>Нет задач</div></div>' : ''}
                        <button class="section-add-btn" onclick="addTaskWithDate()"><i class="fas fa-plus"></i> Добавить задачу</button>
                    </div>
                </div>

                <div class="collapsible-section" id="sec-calendar">
                    <div class="collapsible-header" onclick="toggleSection(this)">

                            <div class="collapsible-icon">📅</div>
                            <div>
                                <div class="collapsible-title">Календарь</div>
                                <div class="collapsible-subtitle">События</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-down collapsible-chevron"></i>
                    </div>
                    <div class="collapsible-body">
                        <div id="profileCalendar"></div>
                    </div>
                </div>

                <div class="collapsible-section" id="sec-appointments">
                    <div class="collapsible-header" onclick="toggleSection(this)">
                        <div class="collapsible-header-left">
                            <div class="collapsible-icon">📞</div>
                            <div>
                                <div class="collapsible-title">Записи клиентов</div>
                                <div class="collapsible-subtitle">${pendingCount > 0 ? `${pendingCount} ожидает подтверждения` : confirmedCount > 0 ? `${confirmedCount} подтверждено` : 'Нет записей'}</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-down collapsible-chevron"></i>
                    </div>
                    <div class="collapsible-body">
                        ${appointments.map(apt => `
                            <div class="appointment-item">
                                <div class="appt-info">
                                    <div class="appt-name">${escapeHtml(apt.clientName)}</div>
                                    <div class="appt-time">📅 ${apt.date} в ${apt.time}</div>
                                    <div class="appt-status ${apt.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">
                                        ${apt.status === 'confirmed' ? '✅ Подтверждено' : '⏳ Ожидает'}
                                    </div>

                                <div class="appt-actions">
                                    ${apt.status === 'pending' ? `<button class="btn-sm" onclick="confirmAppointment('${apt.appointmentId}','${apt.clientId}')">Подтвердить</button>` : ''}
                                    ${apt.status === 'confirmed' ? `<button class="btn-sm" onclick="startCall('${apt.roomId}')"><i class="fas fa-video"></i> Начать</button>` : ''}

                            </div>
                        `).join('')}
                        ${appointments.length === 0 ? '<div class="empty-state" style="padding:16px;"><i class="fas fa-calendar-times"></i><div>Нет записей</div></div>' : ''}
                    </div>
                </div>

                <div class="collapsible-section" id="sec-clients">
                    <div class="collapsible-header" onclick="toggleSection(this)">

                            <div class="collapsible-icon">👥</div>

                                <div class="collapsible-title">Клиенты</div>

                            </div>

                        ${appointments.filter(a => a.status === 'confirmed').length === 0 ? '<div class="empty-state" style="padding:16px;"><i class="fas fa-users-slash"></i><div>Нет завершённых звонков</div></div>' : ''}
                    </div>
                </div>

                <div class="collapsible-section" id="sec-notes">
                    <div class="collapsible-header" onclick="toggleSection(this)">
                        <div class="collapsible-header-left">
                            <div class="collapsible-icon">📝</div>
                            <div>
                                <div class="collapsible-title">Заметки</div>
                                <div class="collapsible-subtitle">${notes.length} заметок</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-down collapsible-chevron"></i>
                    </div>
                    <div class="collapsible-body">
                        <div class="notes-grid">
                            ${notes.map(n => `
                                <div class="note-card" onclick="openNoteModal('${n.id}','${escapeHtml(n.title)}','${escapeHtml(n.content)}','${n.attachment || ''}')">
                                    <div class="note-title">${escapeHtml(n.title)}</div>
                                    <div class="note-preview">${escapeHtml((n.content || '').substring(0, 70))}${(n.content || '').length > 70 ? '…' : ''}</div>
                                </div>
                            `).join('')}

    // ======================= КАЛЕНДАРЬ В ПРОФИЛЕ =======================
    async function renderProfileCalendar() {
        const container = document.getElementById('profileCalendar');
        if (!container) return;
        const year = currentCalendarDate.getFullYear(), month = currentCalendarDate.getMonth();
        const firstDay = new Date(year, month, 1);
        let startDay = firstDay.getDay();
        startDay = startDay === 0 ? 6 : startDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDays = new Date(year, month, 0).getDate();

        const [tasksRes] = await Promise.all([ fetchJSON(`/api/tasks/${currentUser.id}`) ]);
        const tasks = tasksRes.tasks || [];
        const appointments = currentUser.role === 'psychologist' ? (currentUser.clients || []) : (currentUser.appointments || []);
        const events = [];
        tasks.forEach(t => { if (t.dueDate) events.push({ date: t.dueDate.split('T')[0], title: t.text, type: 'task', roomId: null }); });
        appointments.filter(a => a.status === 'confirmed').forEach(a => {
            const title = currentUser.role === 'psychologist' ? `Запись с ${a.clientName} в ${a.time}` : `Запись к ${a.psychologistName} в ${a.time}`;
            events.push({ date: a.date, title: title, type: 'appointment', roomId: a.roomId });
        });

        let daysHtml = '';
        for (let i = 0; i < startDay; i++) {
            daysHtml += `<div class="apple-day other-month">${prevDays - startDay + i + 1}</div>`;
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayEvents = events.filter(e => e.date === dateStr);
            const isToday = dateStr === new Date().toISOString().split('T')[0];
            daysHtml += `<div class="apple-day${dayEvents.length ? ' has-event' : ''}${isToday ? ' today' : ''}" data-date="${dateStr}" data-events='${JSON.stringify(dayEvents).replace(/'/g, "&#39;")}'>
                ${d}${dayEvents.length && !isToday ? '<div class="event-dot-apple"></div>' : ''}
            </div>`;
        }
        const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        container.innerHTML = `
            <div class="apple-calendar">
                <div class="apple-calendar-header">
                    <button class="apple-calendar-nav-btn" onclick="changeProfileMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                    <h3>${monthNames[month]} ${year}</h3>
                    <button class="apple-calendar-nav-btn" onclick="changeProfileMonth(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="apple-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
                <div class="apple-days">${daysHtml}</div>
            </div>
        `;
        document.querySelectorAll('.apple-day').forEach(day => {
            day.onclick = () => {
                const evs = JSON.parse(day.getAttribute('data-events') || '[]');
                if (evs.length) showDayEventsApple(day.getAttribute('data-date'), evs);
                else showToast('Нет событий на эту дату');
            };
        });
    }

    function showDayEventsApple(date, events) {
        let content = `<div style="margin-bottom:16px;"><i class="fas fa-calendar-day"></i> <strong>${date}</strong></div>`;
        events.forEach(ev => {

                content += `
                    <div style="background:var(--green-dim);border-radius:16px;padding:14px;margin-bottom:12px;">

                content += `<div style="background:rgba(255,255,255,0.05);border-radius:16px;padding:14px;margin-bottom:12px;"><i class="fas fa-tasks"></i> ${escapeHtml(ev.title)}</div>`;
            }

        const html = `

        document.body.insertAdjacentHTML('beforeend', html);

    async function addCertificateProfile() {
        const title = await openPromptModal('Название сертификата или диплома:', 'Добавить');
        if (!title) return;
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('userId', currentUser.id);
            fd.append('title', title);
            fd.append('certificate', file);
            showToast('Загружаем...');
            const res = await fetch('/api/certificates', { method:'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                if (data.user) currentUser = data.user;
                else await refreshUser();
                showToast('Сертификат добавлен');
                renderProfile();
                setTimeout(() => {
                    const sec = document.getElementById('sec-certs');
                    if (sec && !sec.classList.contains('open')) sec.classList.add('open');
                }, 100);
            } else {
                showToast(data.error || 'Ошибка загрузки', true);
            }
        };
        input.click();
    }

    function showScheduleEditor() {
        const schedule = currentUser.schedule || {};
        const renderSlots = () => {
            const sched = currentUser.schedule || {};
            const ds = Object.keys(sched).sort();
            return ds.length ? ds.map(d => `
                <div style="margin-bottom:12px;">
                    <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${d}</div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                        ${sched[d].map(t => `
                            <span style="display:inline-flex;align-items:center;gap:6px;background:var(--green-dim);border:1px solid var(--green-border);padding:4px 12px;border-radius:20px;font-size:13px;">
                                ${t}
                                <button onclick="removeSlot('${d}','${t}')" style="background:none;border:none;color:rgba(255,100,100,0.8);cursor:pointer;font-size:12px;padding:0;line-height:1;">✕</button>
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('') : '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет добавленного времени</div></div>';
        };

        const html = `
            <div class="modal" id="scheduleModal">
                <div class="modal-content" style="max-height:85vh;display:flex;flex-direction:column;">
                    <div class="modal-handle"></div>
                    <h3>📅 Свободное время</h3>
                    <div class="schedule-modal-form">
                        <div style="display:flex;gap:8px;align-items:flex-end;">
                            <div style="flex:1;">
                                <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Дата</label>
                                <input type="date" id="slotDate" style="margin-bottom:0;width:100%;">
                            </div>
                            <div style="flex:1;">
                                <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Время</label>
                                <input type="time" id="slotTime" style="margin-bottom:0;width:100%;">
                            </div>
                            <button class="btn-sm" style="height:44px;margin-bottom:0;" onclick="addSlot()"><i class="fas fa-plus"></i> Добавить</button>
                        </div>
                    </div>
                    <div class="schedule-modal-list">
                        ${renderSlots()}
                    </div>
                    <div class="modal-buttons" style="margin-top:0;">
                        <button class="btn-secondary" onclick="closeModal('scheduleModal')">Закрыть</button>
                    </div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('scheduleModal').classList.add('active'), 10);

        window.addSlot = async () => {
            const date = document.getElementById('slotDate').value;
            const time = document.getElementById('slotTime').value;
            if (!date || !time) { showToast('Выберите дату и время', true); return; }
            const sched = currentUser.schedule || {};
            if (!sched[date]) sched[date] = [];
            if (sched[date].includes(time)) { showToast('Такое время уже есть', true); return; }
            sched[date].push(time); sched[date].sort();
            const res = await fetch('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, schedule: sched }) });
            if (res.ok) {
                currentUser.schedule = sched;
                document.getElementById('scheduleModal').querySelector('.schedule-modal-list').innerHTML = renderSlots();
                showToast('Время добавлено');
            }
        };

        window.removeSlot = async (date, time) => {
            const sched = currentUser.schedule || {};
            if (sched[date]) {
                sched[date] = sched[date].filter(t => t !== time);
                if (!sched[date].length) delete sched[date];
                await fetch('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, schedule: sched }) });
                currentUser.schedule = sched;
                document.getElementById('scheduleModal').querySelector('.schedule-modal-list').innerHTML = renderSlots();
            }
        };
    }

    // ======================= ЧАТЫ (С ПОДСЧЁТОМ НЕПРОЧИТАННЫХ) =======================
    function updateUnreadCounts(messages) {
        unreadCounts = {};
        for (const msg of messages) {
            if (msg.to === currentUser.id && !msg.isRead) {
                unreadCounts[msg.from] = (unreadCounts[msg.from] || 0) + 1;
            }
        }
    }

    async function renderChats() {
        if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
        document.body.classList.remove('chat-open');
        document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
        const messagesRes = await fetchJSON(`/api/messages/${currentUser.id}`);
        const messages = messagesRes.messages || [];
        updateUnreadCounts(messages);

        const contactsMap = new Map();
        for (const msg of messages) {
            const contactId = msg.from === currentUser.id ? msg.to : msg.from;
            if (!contactsMap.has(contactId)) {
                contactsMap.set(contactId, {
                    lastMessage: msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение')),
                    lastTime: msg.createdAt,
                    unread: !msg.isRead && msg.to === currentUser.id
                });
            } else {
                const existing = contactsMap.get(contactId);
                if (new Date(msg.createdAt) > new Date(existing.lastTime)) {
                    existing.lastMessage = msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение'));
                    existing.lastTime = msg.createdAt;
                }
                if (!msg.isRead && msg.to === currentUser.id) existing.unread = true;
            }
        }
        const contacts = await Promise.all(Array.from(contactsMap.keys()).map(async id => {
            const r = await fetch(`/api/user/${id}`);
            const d = await r.json();
            if (d.success) return { ...d.user, ...contactsMap.get(id) };
            return null;
        }));
        const validContacts = contacts.filter(Boolean).sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));

        let html = `<div class="container"><div class="page-title">Сообщения</div><div class="chat-list">`;
        for (const c of validContacts) {
            const unreadCount = unreadCounts[c.id] || 0;
            html += `
                <div class="chat-contact glass-card" onclick="openChat('${c.id}','${escapeHtml(c.fullName)}')">
                    <img class="chat-contact-avatar" src="${escapeHtml(c.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.fullName)}&background=8bca8b&color=fff'">
                    <div class="chat-contact-info">
                        <div class="chat-contact-name">${escapeHtml(c.fullName)}</div>
                        <div class="chat-contact-last">${escapeHtml((c.lastMessage || '').substring(0, 40))}</div>
                    </div>
                    ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : (c.unread ? '<div class="unread-dot"></div>' : '')}
                </div>
            `;
        }
        if (validContacts.length === 0) html += '<div class="empty-state glass-card" style="padding:40px;"><i class="fas fa-comment-slash"></i><div>Нет сообщений. Напишите психологу из раздела «Психологи»!</div></div>';
        html += `</div></div>`;
        document.getElementById('mainContent').innerHTML = html;
    }

    async function openChat(userId, userName) {
        currentChatPartner = { id: userId, name: userName };
        // Помечаем сообщения как прочитанные
        await fetch('/api/messages/read', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, fromUserId: userId }) });
        document.getElementById('mainContent').innerHTML = `
            <div class="chat-page">
                <div class="chat-messages-container">
                    <div class="chat-messages-header">
                        <button class="back-btn" onclick="renderChats()"><i class="fas fa-arrow-left"></i></button>
                        <img src="" id="chatPartnerAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--green-border);" onerror="this.style.display='none'">
                        <div style="flex:1">
                            <div style="font-weight:600;font-size:15px;">${escapeHtml(userName)}</div>
                        </div>
                    </div>
                    <div class="chat-messages-list" id="chatMessagesList"></div>
                    <div class="chat-input-area">
                        <div class="chat-controls">
                            <button id="attachImageBtn" title="Фото"><i class="fas fa-image"></i></button>
                            <button id="voiceRecordBtn" title="Голосовое"><i class="fas fa-microphone"></i></button>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                        <input type="text" id="chatMessageInput" placeholder="Сообщение...">
                        <button class="send-btn-chat" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        `;
        document.body.classList.add('chat-open');

        fetch(`/api/user/${userId}`).then(r => r.json()).then(d => {
            const av = document.getElementById('chatPartnerAvatar');
            if (av && d.success) av.src = d.user.avatar;
        });

        await loadChatMessages();
        setupChatSocket();

        document.getElementById('sendMsgBtn').onclick = sendChatMessage;
        document.getElementById('chatMessageInput').onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };

        const attachImageBtn = document.getElementById('attachImageBtn');
        const imageInput = document.getElementById('imageInput');
        attachImageBtn.onclick = () => imageInput.click();
        imageInput.onchange = async () => {
            const file = imageInput.files[0];
            if (!file || !file.type.startsWith('image/')) { showToast('Только изображения', true); return; }
            const compressedBlob = await compressImage(file, 1024, 0.8);
            const formData = new FormData();
            formData.append('image', compressedBlob, file.name);
            const res = await fetch('/api/upload-chat-image', { method:'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                await fetch('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', image: data.imageUrl }) });
                await loadChatMessages();
                scrollToBottom();
            }
            imageInput.value = '';
        };

        let mediaRecorder = null, audioChunks = [], isRecording = false;
        const voiceRecordBtn = document.getElementById('voiceRecordBtn');
        voiceRecordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const fd = new FormData(); fd.append('voice', blob, 'voice.webm');
                        const res = await fetch('/api/upload-voice', { method:'POST', body: fd });
                        const data = await res.json();
                        if (data.success) {
                            await fetch('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', voice: data.voiceUrl }) });
                            await loadChatMessages();
                            scrollToBottom();
                            showToast('Голосовое отправлено');
                        }
                        stream.getTracks().forEach(t => t.stop());
                        voiceRecordBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                        voiceRecordBtn.classList.remove('recording-active');
                        isRecording = false;
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    voiceRecordBtn.classList.add('recording-active');
                    voiceRecordBtn.innerHTML = '<i class="fas fa-stop"></i>';
                    setTimeout(() => { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }, 30000);
                } catch(e) { showToast('Нет доступа к микрофону', true); }
            } else {
                if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
            }
        };
    }

    async function loadChatMessages() {
        if (!currentChatPartner) return;
        const res = await fetchJSON(`/api/messages/${currentUser.id}`);
        const messages = (res.messages || []).filter(m => (m.from === currentChatPartner.id && m.to === currentUser.id) || (m.from === currentUser.id && m.to === currentChatPartner.id));
        messages.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
        const listDiv = document.getElementById('chatMessagesList');
        if (!listDiv) return;
        let html = '';
        for (const m of messages) {
            let voiceHtml = '';
            if (m.voice) {
                voiceHtml = `<div class="voice-message"><audio controls src="${escapeHtml(m.voice)}"></audio></div>`;
            }
            html += `
                <div class="message ${m.from === currentUser.id ? 'outgoing' : 'incoming'}">
                    ${m.text ? `<div class="message-text">${escapeHtml(m.text)}</div>` : ''}
                    ${m.image ? `<img class="chat-image" src="${escapeHtml(m.image)}" onclick="openImageModal('${escapeHtml(m.image)}')">` : ''}
                    ${voiceHtml}
                    <div class="message-time">${new Date(m.createdAt).toLocaleTimeString()}</div>
                </div>
            `;
        }
        listDiv.innerHTML = html;
        document.querySelectorAll('.voice-message').forEach(container => {
            const audio = container.querySelector('audio');
            if (audio && !container.querySelector('.speed-btn')) {
                const speeds = [1, 1.5, 2];
                let currentSpeed = 1;
                const btn = document.createElement('button');
                btn.className = 'speed-btn';
                btn.textContent = `${currentSpeed}x`;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let idx = speeds.indexOf(currentSpeed);
                    idx = (idx + 1) % speeds.length;
                    currentSpeed = speeds[idx];
                    audio.playbackRate = currentSpeed;
                    btn.textContent = `${currentSpeed}x`;
                };
                container.appendChild(btn);
            }
        });
        scrollToBottom();
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatMessageInput');
        if (!input || !input.value.trim()) return;
        const text = input.value.trim();
        input.value = '';
        await fetch('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text }) });
        await loadChatMessages();
        scrollToBottom();
        // Обновляем список чатов, чтобы убрать непрочитанное
        if (currentTab === 'chats') renderChats();
    }

    function setupChatSocket() {
        if (socket) socket.off('new_message');
        socket = io();
        socket.on('connect', () => { if (currentUser) socket.emit('register_user', currentUser.id); });
        socket.on('new_message', async (msg) => {
            if (currentChatPartner && (msg.from === currentChatPartner.id || msg.to === currentChatPartner.id)) {
                await fetch('/api/messages/read', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, fromUserId: msg.from }) });
                await loadChatMessages();
                scrollToBottom();
            } else {
                const userRes = await fetch(`/api/user/${msg.from}`);
                const userData = await userRes.json();
                if (userData.success) {
                    showFloatingNotification('Новое сообщение', `${userData.user.fullName}: ${msg.text?.substring(0,50) || '📷 Фото'}`);
                } else {
                    showFloatingNotification('Новое сообщение', 'У вас новое сообщение');
                }
                if (currentUser) refreshUser();
                if (currentTab === 'chats') renderChats(); // обновляем список чатов
            }
        });
        socket.on('notification', (notif) => {
            showFloatingNotification(notif.title, notif.message);
            if (currentUser) refreshUser();
            if (currentTab === 'notifications') renderNotifications();
            if (currentTab === 'profile') renderProfile();
        });
    }

        switchTab('chats');
        setTimeout(() => openChat(userId, name), 400);
    }

        renderProfile();
    }

    // ======================= ЗАПИСЬ К ПСИХОЛОГУ =======================
    async function bookPsychologist(id, name) {
        if (!allPsychologists.length) await fetchJSON('/api/psychologists').then(d => { allPsychologists = d.psychologists || []; });
        const p = allPsychologists.find(p => p.id === id);
        const sched = p?.schedule || {};
        const dates = Object.keys(sched).sort();

        let slotsHtml = '';
        if (dates.length) {
            for (const d of dates) {
                slotsHtml += `<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${d}</div><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
                for (const t of sched[d]) {
                    slotsHtml += `<button class="time-slot" data-date="${d}" data-time="${t}">${t}</button>`;
                }
                slotsHtml += `</div></div>`;
            }
        } else {
            slotsHtml = '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет свободного времени</div></div>';
        }

        const html = `
            <div class="modal" id="bookModal">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>Записаться к ${name}</h3>
                    <div id="slots" style="max-height:300px;overflow-y:auto;">${slotsHtml}</div>
                    <div id="selSlot" style="margin-top:10px;font-size:13px;color:var(--green);min-height:20px;"></div>
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="closeModal('bookModal')">Отмена</button>
                        <button class="btn-primary" id="confirmBook" disabled onclick="submitBook('${id}')">Записаться</button>
                    </div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('bookModal').classList.add('active'), 10);

        document.querySelectorAll('.time-slot').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.time-slot').forEach(bb => bb.classList.remove('selected'));
                b.classList.add('selected');
                document.getElementById('selSlot').textContent = `✅ Выбрано: ${b.dataset.date} в ${b.dataset.time}`;
                document.getElementById('confirmBook').disabled = false;
                window.selDate = b.dataset.date;
                window.selTime = b.dataset.time;
            };
        });
    }

    async function submitBook(id) {
        if (!window.selDate || !window.selTime) { showToast('Выберите время', true); return; }
        const r = await fetch('/api/appointment', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ clientId: currentUser.id, psychologistId: id, date: window.selDate, time: window.selTime }) });
        const d = await r.json();
        if (d.success) { showToast('Заявка отправлена!'); closeModal('bookModal'); await refreshUser(); }
        else showToast(d.error || 'Ошибка', true);
    }

    // ======================= ОТЗЫВ =======================
    function openReviewModal(id, name) {
        let rating = 0;
        const html = `
            <div class="modal" id="revModal">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>Отзыв о ${name}</h3>
                    <div id="stars" style="display:flex;gap:6px;margin-bottom:18px;justify-content:center;">
                        ${[1,2,3,4,5].map(s => `<i class="far fa-star" data-r="${s}" style="font-size:32px;cursor:pointer;color:#f5c518;"></i>`).join('')}
                    </div>
                    <textarea id="revText" rows="3" placeholder="Расскажите о своём опыте..."></textarea>
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="closeModal('revModal')">Отмена</button>
                        <button class="btn-primary" onclick="window._submitReview('${id}')">Отправить</button>
                    </div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('revModal').classList.add('active'), 10);
        document.querySelectorAll('#stars i').forEach(s => {
            s.onmouseenter = () => {
                document.querySelectorAll('#stars i').forEach((ss, i) => {
                    ss.className = i < parseInt(s.dataset.r) ? 'fas fa-star' : 'far fa-star';
                });
            };
            s.onmouseleave = () => {
                document.querySelectorAll('#stars i').forEach((ss, i) => {
                    ss.className = i < rating ? 'fas fa-star' : 'far fa-star';
                });
            };
            s.onclick = () => {
                rating = parseInt(s.dataset.r);
                document.querySelectorAll('#stars i').forEach((ss, i) => {
                    ss.className = i < rating ? 'fas fa-star' : 'far fa-star';
                });
            };
        });
        window._submitReview = async (pid) => {
            if (!rating) { showToast('Выберите рейтинг', true); return; }
            const r = await fetch('/api/reviews', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ psychologistId: pid, clientId: currentUser.id, rating, text: document.getElementById('revText').value }) });
            const d = await r.json();
            if (d.success) { showToast('Отзыв отправлен!'); closeModal('revModal'); await refreshUser(); }
            else showToast(d.error || 'Ошибка', true);
        };
    }

    // ======================= СОЗДАТЬ ПОСТ =======================
    function createPostModal() {
        const html = `
            <div class="modal" id="cpModal">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>Новый пост</h3>
                    <textarea id="postText" rows="5" placeholder="Поделитесь чем-то полезным..."></textarea>
                    <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">Фото (необязательно)</label>
                    <input type="file" id="postImg" accept="image/*" style="font-size:12px;">
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="closeModal('cpModal')">Отмена</button>
                        <button class="btn-primary" onclick="createPost()">Опубликовать</button>
                    </div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('cpModal').classList.add('active'), 10);
    }

    async function createPost() {
        const txt = document.getElementById('postText').value;
        if (!txt.trim()) { showToast('Введите текст', true); return; }
        const fd = new FormData();
        fd.append('authorId', currentUser.id);
        fd.append('text', txt);
        const fi = document.getElementById('postImg');
        if (fi.files[0]) fd.append('image', fi.files[0]);
        await fetch('/api/posts', { method:'POST', body: fd });
        closeModal('cpModal');
        showToast('Пост опубликован');
        renderProfile();
