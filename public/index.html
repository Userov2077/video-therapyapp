    // ======================= ПОИСК =======================
    function openSearchModal() {
        const html = `
            <div class="modal" id="searchM">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>Поиск психологов</h3>
                    <input type="search" id="searchInp" placeholder="Введите имя...">
                    <div id="searchRes"></div>
                    <div class="modal-buttons"><button class="btn-secondary" onclick="closeModal('searchM')">Закрыть</button></div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => { document.getElementById('searchM').classList.add('active'); document.getElementById('searchInp').focus(); }, 10);
        let searchTimeout;
        document.getElementById('searchInp').oninput = async (e) => {
            clearTimeout(searchTimeout);
            const q = e.target.value;
            if (q.length < 2) { document.getElementById('searchRes').innerHTML = ''; return; }
            searchTimeout = setTimeout(async () => {
                const r = await fetchJSON(`/api/search/psychologists?q=${encodeURIComponent(q)}`);
                if (r.success) {
                    let resHtml = '';
                    for (const p of r.psychologists) {
                        resHtml += `
                            <div class="psychologist-item" style="padding:10px;cursor:pointer;border-radius:12px;" onclick="closeModal('searchM');viewPsychologistPage('${p.id}')">
                                <img src="${escapeHtml(p.avatar)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--green-border);">
                                <div>
                                    <div style="font-weight:600;font-size:14px;">${escapeHtml(p.fullName)}</div>
                                    <div style="font-size:12px;color:var(--text-muted);">${escapeHtml(p.specialization||'Психолог')}</div>
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById('searchRes').innerHTML = resHtml || '<div class="empty-state" style="padding:16px;"><i class="fas fa-search"></i><div>Ничего не найдено</div></div>';
                }
            }, 300);
        };
    }

    // ======================= НАПОМИНАНИЯ =======================
    function checkUpcomingEvents() {
        if (!currentUser) return;
        const now = new Date();
        const appointments = currentUser.role === 'psychologist' ? (currentUser.clients || []) : (currentUser.appointments || []);
        for (const apt of appointments) {
            if (apt.status === 'confirmed') {
                const eventDate = new Date(apt.date + 'T' + apt.time);
                const diff = (eventDate - now) / (1000 * 60);
                if (diff > 0 && diff <= 60 && !localStorage.getItem(`notified_${apt.appointmentId}`)) {
                    showFloatingNotification('Скоро созвон', `Запись с ${apt.clientName || apt.psychologistName} через ${Math.round(diff)} минут`, 'warning');
                    localStorage.setItem(`notified_${apt.appointmentId}`, '1');
                }
            }
        }
        if (currentUser.role === 'psychologist') {
            fetchJSON(`/api/tasks/${currentUser.id}`).then(res => {
                for (const task of (res.tasks || [])) {
                    if (!task.completed && task.dueDate) {
                        const due = new Date(task.dueDate);
                        const today = new Date(); today.setHours(0,0,0,0);
                        const daysDiff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                        if (daysDiff === 0 && !localStorage.getItem(`task_today_${task.id}`)) {
                            showFloatingNotification('Задача на сегодня', task.text, 'warning');
                            localStorage.setItem(`task_today_${task.id}`, '1');
                        } else if (daysDiff === 1 && !localStorage.getItem(`task_tomorrow_${task.id}`)) {
                            showFloatingNotification('Задача на завтра', task.text, 'info');
                            localStorage.setItem(`task_tomorrow_${task.id}`, '1');
                        }
                    }
                }
            });
        }
    }
    setInterval(checkUpcomingEvents, 15 * 60 * 1000);

    // ======================= АВТОРИЗАЦИЯ =======================
    function openLoginModal() {
        const html = `
            <div class="modal" id="loginM">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>Войти в аккаунт</h3>
                    <input type="email" id="logEmail" placeholder="Email">
                    <input type="password" id="logPass" placeholder="Пароль">
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="closeModal('loginM')">Отмена</button>
                        <button class="btn-primary" onclick="login()">Войти</button>
                    </div>
                    <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--text-muted);">Нет аккаунта? <a href="#" onclick="closeModal('loginM');openRegisterModal()" style="color:var(--green);">Зарегистрироваться</a></p>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('loginM').classList.add('active'), 10);
        document.getElementById('logPass').onkeypress = (e) => { if (e.key === 'Enter') login(); };
    }

    function openRegisterModal() {
        const html = `
            <div class="modal" id="regM">
                <div class="modal-content">
                    <div class="modal-handle"></div>
                    <h3>Создать аккаунт</h3>
                    <input type="text" id="regName" placeholder="ФИО *">
                    <input type="email" id="regEmail" placeholder="Email *">
                    <input type="tel" id="regPhone" placeholder="Телефон">
                    <input type="password" id="regPass" placeholder="Пароль (мин 6 символов) *">
                    <select id="regRole">
                        <option value="client">Клиент</option>
                        <option value="psychologist">Психолог</option>
                    </select>
                    <div id="psychF" style="display:none">
                        <input type="text" id="regSpec" placeholder="Специализация *">
                        <input type="text" id="regExp" placeholder="Опыт работы *">
                        <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="closeModal('regM')">Отмена</button>
                        <button class="btn-primary" onclick="register()">Зарегистрироваться</button>
                    </div>
                    <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--text-muted);">Есть аккаунт? <a href="#" onclick="closeModal('regM');openLoginModal()" style="color:var(--green);">Войти</a></p>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        setTimeout(() => document.getElementById('regM').classList.add('active'), 10);
        document.getElementById('regRole').onchange = () => {
            document.getElementById('psychF').style.display = document.getElementById('regRole').value === 'psychologist' ? 'block' : 'none';
        };
    }

    async function login() {
        const e = document.getElementById('logEmail').value;
        const p = document.getElementById('logPass').value;
        if (!e || !p) { showToast('Заполните все поля', true); return; }
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: e, password: p }) });
        const d = await r.json();
        if (d.success) { localStorage.setItem('userId', d.userId); showToast('Добро пожаловать!'); closeModal('loginM'); location.reload(); }
        else showToast(d.error || 'Неверный email или пароль', true);
    }

    async function register() {
        const body = {
            fullName: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            phone: document.getElementById('regPhone').value,
            password: document.getElementById('regPass').value,
            role: document.getElementById('regRole').value
        };
        if (!body.fullName || !body.email || !body.password) { showToast('Заполните обязательные поля', true); return; }
        if (body.role === 'psychologist') {
            body.specialization = document.getElementById('regSpec').value;
            body.experience = document.getElementById('regExp').value;
            body.about = document.getElementById('regAbout').value;
        }
        const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const d = await r.json();
        if (d.success) { showToast('Регистрация успешна! Войдите'); closeModal('regM'); openLoginModal(); }
        else showToast(d.error || 'Ошибка регистрации', true);
    }

    function logout() {
        openConfirmModal('Выйти из аккаунта?', '', () => { localStorage.clear(); location.reload(); });
    }

    function startCall(roomId) { window.location.href = `/call.html?room=${roomId}`; }

    async function refreshUser() {
        const r = await fetch(`/api/user/${currentUser.id}`);
        const d = await r.json();
        if (d.success) currentUser = d.user;
    }

    function closeModal(id) {
        const m = document.getElementById(id);
        if (m) { m.classList.remove('active'); setTimeout(() => m.remove(), 320); }
    }

    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) {
            e.target.classList.remove('active');
            setTimeout(() => e.target.remove(), 320);
        }
    });

    // ======================= ПРОМПТ МОДАЛ =======================
    function openPromptModal(label, confirmText = 'ОК') {
        return new Promise((resolve) => {
            const modalId = 'promptModal_' + Date.now();
            const html = `
                <div class="modal" id="${modalId}">
                    <div class="modal-content">
                        <div class="modal-handle"></div>
                        <h3>${escapeHtml(label)}</h3>
                        <input type="text" id="promptInput_${modalId}" placeholder="Введите текст...">
                        <div class="modal-buttons">
                            <button class="btn-secondary" id="cancelBtn_${modalId}">Отмена</button>
                            <button class="btn-primary" id="okBtn_${modalId}">${escapeHtml(confirmText)}</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            const modal = document.getElementById(modalId);
            const input = document.getElementById(`promptInput_${modalId}`);
            const cancel = document.getElementById(`cancelBtn_${modalId}`);
            const ok = document.getElementById(`okBtn_${modalId}`);
            const cleanup = () => {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300);
            };
            ok.onclick = () => { const val = input.value.trim(); cleanup(); resolve(val || null); };
            cancel.onclick = () => { cleanup(); resolve(null); };
            input.onkeypress = (e) => { if (e.key === 'Enter') { const val = input.value.trim(); cleanup(); resolve(val || null); } };
            setTimeout(() => modal.classList.add('active'), 10);
            input.focus();
        });
    }

    // ======================= НАВИГАЦИЯ =======================
    function switchTab(tab) {
        document.body.classList.remove('chat-open');
        currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const act = document.querySelector(`.nav-item[data-tab="${tab}"]`);
        if (act) act.classList.add('active');
        if (tab === 'feed') renderFeed();
        else if (tab === 'psychologists') renderPsychologistsList();
        else if (tab === 'chats') renderChats();
        else if (tab === 'notifications') renderNotifications();
        else if (tab === 'profile') renderProfile();
    }

    // ======================= ИНИЦИАЛИЗАЦИЯ =======================
    async function init() {
        const uid = localStorage.getItem('userId');
        if (uid) {
            try {
                const r = await fetch(`/api/user/${uid}`);
                const d = await r.json();
                if (d.success) {
                    currentUser = d.user;
                    document.getElementById('navAuth').style.display = 'none';
                    document.getElementById('navUser').style.display = 'flex';
                    document.getElementById('bottomNav').style.display = 'flex';
                    await fetchJSON('/api/psychologists').then(d => { allPsychologists = d.psychologists || []; });
                    document.getElementById('searchNavBtn').onclick = openSearchModal;
                }
            } catch(e) { localStorage.clear(); }
        }
        document.querySelectorAll('.nav-item').forEach(el => { el.onclick = () => switchTab(el.dataset.tab); });
        if (currentUser) { switchTab('feed'); checkUpcomingEvents(); }
        else { renderFeed(); }
    }
    init();
    </script>
