<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Видеозвонок | Therapy Call</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --green: #8bca8b;
            --green-dark: #5a9e5a;
            --green-dim: rgba(139, 202, 139, 0.15);
            --green-border: rgba(139, 202, 139, 0.25);
            --glass: rgba(10, 18, 12, 0.72);
            --border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; color: #fff; }

        /* ── Video background (same as main) ── */
        .bg-video {
            position: fixed; inset: 0; z-index: 0;
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(8px) brightness(0.35);
        }
        .bg-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,8,2,0.5) 100%);
        }

        /* ── Main video layout ── */
        .call-root { position: fixed; inset: 0; z-index: 2; }

        /* Remote video — full screen */
        .remote-video-wrap {
            position: absolute; inset: 0;
            background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #remoteVideo {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Waiting overlay on remote */
        .waiting-overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); z-index: 2;
            gap: 16px;
        }
        .waiting-overlay.hidden { display: none; }
        .spinner-ring {
            width: 56px; height: 56px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-overlay p { font-size: 15px; color: rgba(255,255,255,0.7); font-weight: 400; }

        /* Local video — picture-in-picture */
        .local-video-wrap {
            position: absolute;
            bottom: 120px; right: 16px;
            width: 110px; height: 160px;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: all 0.32s cubic-bezier(0.32,0.72,0,1);
            touch-action: none;
        }
        .local-video-wrap.expanded {
            width: 100%; height: 100%;
            bottom: 0; right: 0;
            border-radius: 0; border: none;
        }
        .local-video-wrap.swapped { z-index: 3; }
        #localVideo {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .local-label {
            position: absolute; bottom: 8px; left: 8px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
            font-size: 10px; padding: 3px 8px; border-radius: 10px;
            color: rgba(255,255,255,0.8);
        }
        .swap-hint {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
            border-radius: 8px; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: rgba(255,255,255,0.6);
        }

        /* ── Top bar ── */
        .call-topbar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 52px 18px 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 20;
        }
        .call-partner-name {
            font-size: 18px; font-weight: 600; letter-spacing: -0.2px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
        }
        .call-duration {
            font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .room-pill {
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 5px 12px; font-size: 11px; color: rgba(255,255,255,0.5);
            display: flex; align-items: center; gap: 5px;
        }
        .room-pill i { color: var(--green); font-size: 9px; }

        /* ── Bottom controls ── */
        .call-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 16px 24px calc(28px + env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, transparent 100%);
            display: flex; align-items: center; justify-content: center;
            gap: 16px; z-index: 20;
        }
        .ctrl-btn {
            width: 56px; height: 56px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            color: white; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.22s; border: 1px solid rgba(255,255,255,0.12);
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.07); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.muted { background: rgba(245,158,11,0.35); border-color: rgba(245,158,11,0.5); color: #f59e0b; }
        .ctrl-btn.end-call { background: rgba(220,38,38,0.85); border-color: transparent; width: 64px; height: 64px; font-size: 22px; }
        .ctrl-btn.end-call:hover { background: #dc2626; }
        .ctrl-btn.recording { background: rgba(220,38,38,0.35); border-color: rgba(220,38,38,0.5); color: #ff6b6b; animation: recPulse 1.2s infinite; }
        .ctrl-btn.active-chat { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }
        @keyframes recPulse { 0%,100% { opacity:1; } 50% { opacity:0.55; } }

        /* Recording indicator */
        .rec-indicator {
            position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
            background: rgba(220,38,38,0.85); backdrop-filter: blur(10px);
            padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
            display: none; align-items: center; gap: 6px; z-index: 30;
        }
        .rec-indicator.show { display: flex; }
        .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: recPulse 1s infinite; }

        /* ── Chat panel ── */
        .chat-panel {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 70%; max-height: 520px;
            background: rgba(8,16,10,0.95); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 50;
            display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
        }
        .chat-panel.open { transform: translateY(0); }
        .chat-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .chat-panel-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .chat-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; margin: 10px auto 0; }
        .close-chat-btn {
            background: rgba(255,255,255,0.08); border: none; width: 32px; height: 32px;
            border-radius: 50%; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 14px;
        }
        .chat-panel-messages {
            flex: 1; overflow-y: auto; padding: 14px 16px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-panel-messages::-webkit-scrollbar { width: 3px; }
        .chat-panel-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
        .chat-msg {
            max-width: 78%; padding: 9px 13px; border-radius: 18px;
            word-wrap: break-word; animation: msgIn 0.2s ease;
            font-size: 14px; line-height: 1.45;
        }
        @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .chat-msg.out {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #0d2010; border-bottom-right-radius: 4px;
        }
        .chat-msg.inc {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }
        .chat-msg-time { font-size: 9.5px; opacity: 0.5; margin-top: 4px; text-align: right; }
        .chat-msg.inc .chat-msg-time { text-align: left; }
        .chat-panel-input {
            display: flex; gap: 8px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.07);
            background: rgba(0,0,0,0.3);
        }
        .chat-panel-input input {
            flex: 1; padding: 11px 16px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.07);
            color: white; font-size: 14px; outline: none; transition: border 0.2s; font-family: inherit;
        }
        .chat-panel-input input:focus { border-color: var(--green-border); }
        .send-chat-btn {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #0d2010; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .send-chat-btn:hover { opacity: 0.88; transform: scale(1.06); }
        .chat-empty {
            text-align: center; color: rgba(255,255,255,0.3); font-size: 13px;
            padding: 30px; display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .chat-empty i { font-size: 28px; opacity: 0.4; }

        /* New message badge on chat btn */
        .chat-badge {
            position: absolute; top: -2px; right: -2px;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--green); color: #0d2010;
            font-size: 9px; font-weight: 700;
            display: none; align-items: center; justify-content: center;
            border: 2px solid transparent;
        }
        .chat-badge.show { display: flex; }
        .ctrl-btn-wrap { position: relative; display: inline-flex; }

        /* ── Connection status ── */
        .conn-status {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 8px 18px; font-size: 12px; color: rgba(255,255,255,0.6);
            z-index: 5; pointer-events: none; text-align: center;
            transition: opacity 0.4s;
        }
        .conn-status.hidden { opacity: 0; }

        /* Toast */
        .call-toast {
            position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
            background: rgba(14,22,15,0.95); backdrop-filter: blur(16px);
            border: 1px solid var(--green-border); border-radius: 30px;
            padding: 8px 18px; color: var(--green); font-size: 12px; font-weight: 500;
            z-index: 100; animation: toastIn 0.3s ease;
            white-space: nowrap; max-width: calc(100vw - 32px);
        }
        .call-toast.err { border-color: rgba(220,38,38,0.4); color: #ff6b6b; }
        @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

        /* ── Desktop layout (side by side) ── */
        @media (min-width: 900px) {
            .local-video-wrap {
                bottom: 100px; right: 24px;
                width: 220px; height: 160px;
            }
            .local-video-wrap.expanded {
                width: 50%; height: 100%;
                right: 0; bottom: 0; border-radius: 0;
            }
            .call-controls { gap: 20px; }
            .ctrl-btn { width: 60px; height: 60px; font-size: 22px; }
            .ctrl-btn.end-call { width: 68px; height: 68px; }
            .chat-panel { max-width: 420px; right: 0; left: auto; border-radius: 0; border-top: none; border-left: 1px solid rgba(255,255,255,0.08); height: 100%; max-height: 100%; transform: translateX(100%); }
            .chat-panel.open { transform: translateX(0); }
            .local-video-wrap.chat-open { right: 434px; }
        }
    </style>
</head>
<body>
    <!-- Background video (same as main site) -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://sylvan.apple.com/itunes-assets/Aerials116/v4/cb/5b/50/cb5b5035-6701-619f-9065-3d7d0e5fbef4/A007C0001_Final_v2_HEVC.mov" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="call-root">
        <!-- Remote (big) video -->
        <div class="remote-video-wrap">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="waiting-overlay" id="waitingOverlay">
                <div class="spinner-ring"></div>
                <p>Ожидание собеседника...</p>
            </div>
        </div>

        <!-- Connection status badge -->
        <div class="conn-status" id="connStatus">Подключение...</div>

        <!-- Recording indicator -->
        <div class="rec-indicator" id="recIndicator">
            <div class="rec-dot"></div> Запись идёт
        </div>

        <!-- Local (small, pip) video -->
        <div class="local-video-wrap" id="localWrap">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="local-label">Вы</div>
            <div class="swap-hint"><i class="fas fa-expand-arrows-alt"></i></div>
        </div>

        <!-- Top bar -->
        <div class="call-topbar">
            <div>
                <div class="call-partner-name" id="partnerName">Собеседник</div>
                <div class="call-duration" id="callDuration">Звонок...</div>
            </div>
            <div class="room-pill"><i class="fas fa-circle"></i> <span id="roomLabel">...</span></div>
        </div>

        <!-- Controls -->
        <div class="call-controls">
            <button class="ctrl-btn" id="toggleMic" title="Микрофон">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="ctrl-btn" id="toggleCam" title="Камера">
                <i class="fas fa-video"></i>
            </button>
            <button class="ctrl-btn end-call" id="endCall" title="Завершить">
                <i class="fas fa-phone-slash"></i>
            </button>
            <button class="ctrl-btn" id="recordBtn" title="Запись">
                <i class="fas fa-circle"></i>
            </button>
            <div class="ctrl-btn-wrap">
                <button class="ctrl-btn" id="chatToggleBtn" title="Чат">
                    <i class="fas fa-comment-dots"></i>
                </button>
                <div class="chat-badge" id="chatBadge">!</div>
            </div>
        </div>

        <!-- Chat panel (slide up) -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-handle"></div>
            <div class="chat-panel-header">
                <div class="chat-panel-title"><i class="fas fa-comment-dots" style="color:var(--green);"></i> Чат звонка</div>
                <button class="close-chat-btn" id="closeChatBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="chat-panel-messages" id="chatMessages">
                <div class="chat-empty">
                    <i class="fas fa-comment"></i>
                    <span>Здесь будут сообщения во время звонка</span>
                </div>
            </div>
            <div class="chat-panel-input">
                <input type="text" id="chatInput" placeholder="Написать сообщение...">
                <button class="send-chat-btn" id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    (function() {
        // ── State ──
        let socket = null;
        let localStream = null;
        let peerConnection = null;
        let currentRoomId = null;
        let userRole = null;
        let partnerSocketId = null;
        let currentUserId = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let reconnectAttempts = 0;
        let callStartTime = null;
        let durationInterval = null;
        let chatOpen = false;
        let hasNewMessage = false;
        let pipSwapped = false;
        let isDragging = false;
        let dragStartX, dragStartY, pipStartX, pipStartY;
        const MAX_RECONNECT = 3;

        const urlParams = new URLSearchParams(window.location.search);
        currentRoomId = urlParams.get('room');
        userRole = urlParams.get('role');
        currentUserId = localStorage.getItem('userId');

        const $ = id => document.getElementById(id);

        // ── Elements ──
        const remoteVideo = $('remoteVideo');
        const localVideo = $('localVideo');
        const localWrap = $('localWrap');
        const waitingOverlay = $('waitingOverlay');
        const connStatus = $('connStatus');
        const recIndicator = $('recIndicator');
        const chatPanel = $('chatPanel');
        const chatMessages = $('chatMessages');
        const chatInput = $('chatInput');
        const sendChatBtn = $('sendChatBtn');
        const chatToggleBtn = $('chatToggleBtn');
        const closeChatBtn = $('closeChatBtn');
        const chatBadge = $('chatBadge');

        $('roomLabel').textContent = currentRoomId || '—';

        function showToast(msg, isErr = false) {
            document.querySelectorAll('.call-toast').forEach(t => t.remove());
            const t = document.createElement('div');
            t.className = `call-toast${isErr ? ' err' : ''}`;
            t.textContent = msg;
            document.querySelector('.call-root').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function setStatus(msg, isErr = false) {
            connStatus.textContent = msg;
            connStatus.style.color = isErr ? '#ff6b6b' : 'rgba(255,255,255,0.6)';
            connStatus.classList.remove('hidden');
            clearTimeout(window._statusTimeout);
            window._statusTimeout = setTimeout(() => connStatus.classList.add('hidden'), 4000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
        }

        // ── Duration timer ──
        function startTimer() {
            callStartTime = Date.now();
            durationInterval = setInterval(() => {
                const sec = Math.floor((Date.now() - callStartTime) / 1000);
                const m = String(Math.floor(sec / 60)).padStart(2,'0');
                const s = String(sec % 60).padStart(2,'0');
                $('callDuration').textContent = `${m}:${s}`;
            }, 1000);
        }

        // ── PiP swap on tap ──
        localWrap.addEventListener('click', (e) => {
            if (isDragging) return;
            // Swap pip and remote
            pipSwapped = !pipSwapped;
            if (pipSwapped) {
                localWrap.classList.add('swapped');
                remoteVideo.parentElement.style.zIndex = '1';
                localWrap.style.width = '100%'; localWrap.style.height = '100%';
                localWrap.style.bottom = '0'; localWrap.style.right = '0';
                localWrap.style.borderRadius = '0'; localWrap.style.border = 'none';
                localWrap.style.boxShadow = 'none';
                localVideo.style.transform = 'scaleX(-1)';
                localWrap.querySelector('.swap-hint').innerHTML = '<i class="fas fa-compress-arrows-alt"></i>';
            } else {
                localWrap.classList.remove('swapped');
                remoteVideo.parentElement.style.zIndex = '';
                resetPipSize();
                localWrap.querySelector('.swap-hint').innerHTML = '<i class="fas fa-expand-arrows-alt"></i>';
            }
        });

        function resetPipSize() {
            const isMobile = window.innerWidth < 900;
            localWrap.style.width = isMobile ? '110px' : '220px';
            localWrap.style.height = isMobile ? '160px' : '160px';
            localWrap.style.bottom = isMobile ? '120px' : '100px';
            localWrap.style.right = '16px';
            localWrap.style.borderRadius = '18px';
            localWrap.style.border = '2px solid rgba(255,255,255,0.2)';
            localWrap.style.boxShadow = '0 8px 32px rgba(0,0,0,0.5)';
        }

        // ── Draggable PiP ──
        function onDragStart(e) {
            if (pipSwapped) return;
            isDragging = false;
            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX; dragStartY = touch.clientY;
            const rect = localWrap.getBoundingClientRect();
            pipStartX = rect.right; pipStartY = rect.bottom;
            localWrap.style.transition = 'none';
        }
        function onDragMove(e) {
            if (pipSwapped) return;
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - dragStartX;
            const dy = touch.clientY - dragStartY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) isDragging = true;
            if (!isDragging) return;
            e.preventDefault();
            const newRight = Math.max(8, Math.min(window.innerWidth - 80, pipStartX - touch.clientX - 0 + (pipStartX - dragStartX)));
            const newBottom = Math.max(90, Math.min(window.innerHeight - 80, pipStartY - touch.clientY - 0 + (pipStartY - dragStartY)));
            localWrap.style.right = `${window.innerWidth - touch.clientX - parseInt(localWrap.style.width || 110)/2}px`;
            localWrap.style.bottom = `${window.innerHeight - touch.clientY - parseInt(localWrap.style.height || 160)/2}px`;
        }
        function onDragEnd() {
            if (!pipSwapped) localWrap.style.transition = 'all 0.32s cubic-bezier(0.32,0.72,0,1)';
            setTimeout(() => { isDragging = false; }, 50);
        }
        localWrap.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);
        localWrap.addEventListener('touchstart', onDragStart, { passive: true });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);

        // ── Chat ──
        function toggleChat() {
            chatOpen = !chatOpen;
            chatPanel.classList.toggle('open', chatOpen);
            chatToggleBtn.classList.toggle('active-chat', chatOpen);
            if (chatOpen) {
                chatBadge.classList.remove('show');
                hasNewMessage = false;
                setTimeout(() => chatInput.focus(), 400);
            }
        }
        chatToggleBtn.onclick = toggleChat;
        closeChatBtn.onclick = toggleChat;

        // Swipe down to close chat
        let chatTouchStartY = 0;
        chatPanel.addEventListener('touchstart', e => { chatTouchStartY = e.touches[0].clientY; }, { passive: true });
        chatPanel.addEventListener('touchend', e => {
            const dy = e.changedTouches[0].clientY - chatTouchStartY;
            if (dy > 60) toggleChat();
        }, { passive: true });

        function addChatMessage(text, isOut = false, time = null) {
            const empty = chatMessages.querySelector('.chat-empty');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = `chat-msg ${isOut ? 'out' : 'inc'}`;
            const timeStr = time ? new Date(time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            div.innerHTML = `<div>${escapeHtml(text)}</div><div class="chat-msg-time">${timeStr}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            if (!isOut && !chatOpen) {
                hasNewMessage = true;
                chatBadge.classList.add('show');
            }
        }

        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text || !partnerSocketId) return;
            addChatMessage(text, true);
            socket.emit('call-message', { text });
            chatInput.value = '';
        }
        sendChatBtn.onclick = sendChatMessage;
        chatInput.onkeypress = e => { if (e.key === 'Enter') sendChatMessage(); };

        // ── WebRTC ──
        const iceServers = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
        ];

        async function createPC() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            peerConnection = new RTCPeerConnection({ iceServers });
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.ontrack = e => {
                remoteVideo.srcObject = e.streams[0];
                waitingOverlay.classList.add('hidden');
                setStatus('✅ Соединение установлено');
                startTimer();
                $('callDuration').textContent = '00:00';
            };
            peerConnection.onicecandidate = e => {
                if (e.candidate && partnerSocketId) socket.emit('ice-candidate', { target: partnerSocketId, candidate: e.candidate });
            };
            peerConnection.oniceconnectionstatechange = () => {
                const s = peerConnection.iceConnectionState;
                if (s === 'connected') { setStatus('🟢 Соединение стабильно'); reconnectAttempts = 0; }
                if (s === 'disconnected') setStatus('⚠️ Нестабильное соединение', true);
                if (s === 'failed') {
                    setStatus('❌ Соединение разорвано', true);
                    if (reconnectAttempts < MAX_RECONNECT) { reconnectAttempts++; setTimeout(reconnect, 2000); }
                }
            };
        }

        async function initRTC(doOffer = true) {
            await createPC();
            if (doOffer && userRole === 'psychologist' && partnerSocketId) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { target: partnerSocketId, sdp: offer });
            }
        }

        async function reconnect() {
            setStatus('Переподключение...');
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            partnerSocketId = null;
            waitingOverlay.classList.remove('hidden');
            remoteVideo.srcObject = null;
            if (durationInterval) { clearInterval(durationInterval); $('callDuration').textContent = 'Переподключение...'; }
            if (socket) socket.emit('join-call-room', currentRoomId, currentUserId, userRole);
        }

        // ── Controls ──
        $('toggleMic').onclick = () => {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            $('toggleMic').classList.toggle('muted', !track.enabled);
            $('toggleMic').querySelector('i').className = track.enabled ? 'fas fa-microphone' : 'fas fa-microphone-slash';
        };

        $('toggleCam').onclick = () => {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            $('toggleCam').classList.toggle('muted', !track.enabled);
            $('toggleCam').querySelector('i').className = track.enabled ? 'fas fa-video' : 'fas fa-video-slash';
        };

        $('endCall').onclick = () => {
            if (socket) socket.emit('end-call');
            if (isRecording) stopRecording();
            cleanup();
            window.location.href = '/';
        };

        $('recordBtn').onclick = () => {
            if (isRecording) stopRecording(); else startRecording();
        };

        // ── Recording ──
        async function startRecording() {
            if (!localStream) return;
            try {
                const audioCtx = new AudioContext();
                const dest = audioCtx.createMediaStreamDestination();
                const mic = audioCtx.createMediaStreamSource(new MediaStream([localStream.getAudioTracks()[0]]));
                mic.connect(dest);
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(new MediaStream([...dest.stream.getAudioTracks()]), { mimeType: 'audio/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const fd = new FormData();
                    fd.append('recording', blob, `rec-${Date.now()}.webm`);
                    fd.append('from', currentUserId || '');
                    fd.append('to', partnerSocketId || 'unknown');
                    fd.append('roomId', currentRoomId || '');
                    const res = await fetch('/api/upload-recording', { method:'POST', body: fd });
                    const d = await res.json();
                    if (d.success) showToast('Запись сохранена');
                    audioCtx.close();
                };
                mediaRecorder.start(1000);
                isRecording = true;
                $('recordBtn').classList.add('recording');
                $('recordBtn').querySelector('i').className = 'fas fa-stop-circle';
                recIndicator.classList.add('show');
                showToast('Запись началась');
            } catch(err) { showToast('Ошибка записи: ' + err.message, true); }
        }

        function stopRecording() {
            if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
            isRecording = false;
            $('recordBtn').classList.remove('recording');
            $('recordBtn').querySelector('i').className = 'fas fa-circle';
            recIndicator.classList.remove('show');
        }

        function cleanup() {
            if (durationInterval) clearInterval(durationInterval);
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
        }

        // ── Main start ──
        async function startCall() {
            setStatus('Запрашиваем камеру...');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                setStatus('Подключаемся к серверу...');
            } catch(err) {
                setStatus('Нет доступа к камере', true);
                showToast('Не удалось получить доступ к камере или микрофону', true);
                return;
            }

            socket = io();

            socket.on('connect', () => {
                setStatus('Ожидаем собеседника...');
                socket.emit('join-call-room', currentRoomId, currentUserId, userRole);
            });

            socket.on('room-joined', () => setStatus('В комнате. Ожидание...'));

            socket.on('call-ready', async data => {
                setStatus('Собеседник найден, устанавливаем соединение...');
                partnerSocketId = data.partnerId;
                await initRTC(true);
            });

            socket.on('offer', async data => {
                partnerSocketId = data.from;
                if (!peerConnection) await initRTC(false);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const ans = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(ans);
                socket.emit('answer', { target: partnerSocketId, sdp: ans });
            });

            socket.on('answer', async data => {
                if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            });

            socket.on('ice-candidate', async data => {
                if (peerConnection) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
                }
            });

            socket.on('call-message', data => {
                addChatMessage(data.text, false, data.time);
            });

            socket.on('call-ended', () => {
                setStatus('Звонок завершён');
                showToast('Звонок завершён собеседником');
                if (isRecording) stopRecording();
                setTimeout(() => { cleanup(); window.location.href = '/'; }, 2000);
            });

            socket.on('partner-disconnected', () => {
                setStatus('Собеседник отключился', true);
                showToast('Собеседник покинул звонок', true);
                waitingOverlay.classList.remove('hidden');
                remoteVideo.srcObject = null;
                if (durationInterval) { clearInterval(durationInterval); }
                setTimeout(() => { cleanup(); window.location.href = '/'; }, 2500);
            });

            // Try to get partner name
            if (currentUserId) {
                fetch(`/api/user/${currentUserId}`).then(r => r.json()).then(d => {
                    if (!d.success) return;
                    // Look for appointment partner
                    const clients = d.user.clients || [];
                    const appt = clients.find(c => c.roomId === currentRoomId);
                    if (appt) $('partnerName').textContent = appt.clientName || 'Собеседник';
                    else {
                        const appts = d.user.appointments || [];
                        const myAppt = appts.find(a => a.roomId === currentRoomId);
                        if (myAppt) $('partnerName').textContent = myAppt.psychologistName || 'Психолог';
                    }
                }).catch(() => {});
            }
        }

        startCall();
    })();
    </script>
</body>
